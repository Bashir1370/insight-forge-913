name: Quality

on:
  push:
    branches:
      - main
      - 'stabilization/**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Prettier formatting
        run: bun run format

      - name: Commit formatting on stabilization push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/stabilization/')
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format codebase with Prettier"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint > lint-report.txt 2>&1

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: error

      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: |
          cat lint-report.txt
          exit 1

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
