name: Install GDC Project Summary Stage

on:
  workflow_dispatch:

jobs:
  install-stage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          test -f src/features/data-resources/GdcProjectSummaryReadingStage.tsx
          test -f public/images/gdc/gdc-project-summary-reading.png

      - name: Install dependencies
        run: |
          npm install

      - name: Typecheck
        run: |
          npm run typecheck || true
